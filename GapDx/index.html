<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GapDx • Real-Time Diagnostic Gap Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.0/build/fhir-client.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); }
    .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.7); }
    .card-hover { transition: all 0.3s ease; cursor: pointer; }
    .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(59,130,246,0.22); }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
    .hidden { display: none; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Patient List Page (Only shown in non-Epic mode) -->
  <div id="listPage">
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-xl">
      <div class="max-w-7xl mx-auto px-6 py-12 text-center">
        <h1 class="text-5xl md:text-7xl font-black">GapDx</h1>
        <p class="text-2xl font-light mt-3 opacity-90">Real-Time Diagnostic Gap Intelligence</p>
        <div class="mt-8 inline-flex items-center gap-3 bg-white/20 px-8 py-4 rounded-full">
          <div class="w-4 h-4 bg-green-400 rounded-full pulse"></div>
          <span class="font-bold text-xl">LIVE • Demo Mode (Simulated)</span>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-12">
      <p class="text-center text-xl text-gray-600 mb-8">This is the simulated demo mode. Launch from Epic to see real patient data.</p>
      <!-- Your full 5 patient cards here - keep as is -->
    </div>
  </div>

  <!-- Patient Detail Page -->
  <div id="detailPage" class="hidden">
    <div class="max-w-7xl mx-auto px-6 py-12">
      <button onclick="showList()" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-bold text-lg mb-8">
        ← Back to Patient List
      </button>

      <div class="glass rounded-3xl p-10 shadow-2xl">
        <div class="flex justify-between items-start mb-10">
          <div>
            <h1 class="text-5xl font-black text-gray-800" id="patientName">Loading...</h1>
            <p class="text-2xl text-gray-600 mt-2" id="patientLocation"></p>
          </div>
          <div class="text-right">
            <p class="text-7xl font-black bg-gradient-to-r from-blue-600 to-indigo-700 bg-clip-text text-transparent" id="revenue">$0</p>
            <p class="text-2xl font-bold text-indigo-600 mt-2">Additional Reimbursement</p>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
          <div class="bg-blue-50 rounded-2xl p-6 text-center"><p class="text-sm text-blue-600 font-semibold">Temp</p><p class="text-3xl font-bold mt-2" id="temp">-</p></div>
          <div class="bg-red-50 rounded-2xl p-6 text-center"><p class="text-sm text-red-600 font-semibold">RR</p><p class="text-3xl font-bold mt-2" id="rr">-</p></div>
          <div class="bg-orange-50 rounded-2xl p-6 text-center"><p class="text-sm text-orange-600 font-semibold">SBP</p><p class="text-3xl font-bold mt-2" id="sbp">-</p></div>
          <div class="bg-purple-50 rounded-2xl p-6 text-center"><p class="text-sm text-purple-600 font-semibold">HR</p><p class="text-3xl font-bold mt-2" id="hr">-</p></div>
        </div>

        <h2 class="text-4xl font-black text-gray-800 mb-8">GapDx Clinical Findings</h2>
        <div id="diagnosisList" class="space-y-10"></div>

        <div class="mt-12 p-8 bg-green-50 border-2 border-green-300 rounded-3xl text-center">
          <p class="text-2xl font-bold text-green-800">Physician Alert Sent</p>
          <p class="text-xl text-green-700 mt-2">Dr. Patel notified at <span id="alertTime"></span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simulated fallback patients
    const patients = {
      1005: { name: "Martha Reynolds", location: "Ortho-6", revenue: 76800, vitals: {temp:"97.1°F", rr:"26", sbp:"76", hr:"118"}, findings: [
        {dx:"Hypovolemic Shock (impending)", rev:42800, evidence:"SBP trend 108 → 92 → 76 mmHg over 12h, UOP 15 mL/hr, tachycardia 118", rationale:"Patient meets shock index >1.0 and SIRS criteria with ongoing volume loss — urgent resuscitation needed."},
        {dx:"Acute blood-loss anemia (D62)", rev:34000, evidence:"Hgb dropped 12.1 → 8.4 → 6.9 g/dL in 48h, likely post-op bleed", rationale:"Severe acute anemia contributing to hemodynamic instability — requires transfusion and source control."}
      ]},
      // ... your other 4 patients (keep them for fallback)
    };

    function showPatient(id) {
      currentPatient = patients[id];
      document.getElementById("patientName").textContent = currentPatient.name;
      document.getElementById("patientLocation").textContent = currentPatient.location;
      document.getElementById("temp").textContent = currentPatient.vitals.temp;
      document.getElementById("rr").textContent = currentPatient.vitals.rr;
      document.getElementById("sbp").textContent = currentPatient.vitals.sbp;
      document.getElementById("hr").textContent = currentPatient.vitals.hr;
      document.getElementById("alertTime").textContent = new Date().toLocaleTimeString();

      const list = document.getElementById("diagnosisList");
      list.innerHTML = "";
      currentPatient.findings.forEach(f => {
        const card = document.createElement("div");
        card.className = "glass rounded-3xl p-8 border border-blue-200 shadow-lg";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-6">
            <h3 class="text-3xl font-black text-blue-700">${f.dx}</h3>
            <p class="text-4xl font-black text-green-600">+$${f.rev.toLocaleString()}</p>
          </div>
          <div class="p-6 bg-blue-50 rounded-2xl border-l-6 border-blue-600">
            <p class="font-bold text-blue-900 mb-2">Clinical Evidence:</p>
            <p class="text-blue-800">${f.evidence}</p>
          </div>
          <div class="mt-6 p-6 bg-indigo-50 rounded-2xl border-l-6 border-indigo-600">
            <p class="font-bold text-indigo-900">Why This Qualifies:</p>
            <p class="text-indigo-800 mt-2">${f.rationale}</p>
          </div>
          <button onclick="this.innerText='Accepted'; this.disabled=true; this.classList.replace('bg-blue-600','bg-gray-500')" 
                  class="mt-6 w-full py-5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl rounded-xl transition shadow-lg">
            Accept & Add to Progress Note
          </button>
        `;
        list.appendChild(card);
      });

      document.getElementById("listPage").classList.add("hidden");
      document.getElementById("detailPage").classList.remove("hidden");
      new CountUp("revenue", currentPatient.revenue, { duration: 2.5, formattingFn: n => "$" + n.toLocaleString() }).start();
    }

    function showList() {
      document.getElementById("detailPage").classList.add("hidden");
      document.getElementById("listPage").classList.remove("hidden");
    }

    // Real Epic data using official SMART client library
    window.onload = () => {
      FHIR.oauth2.ready()
        .then(client => {
          // Fetch real patient
          client.request("Patient").then(patient => {
            document.getElementById("patientName").textContent = patient.name[0].text || "Epic Sandbox Patient";
            document.getElementById("patientLocation").textContent = `FHIR ID: ${patient.id}`;
            document.getElementById("temp").textContent = "Real Epic Data";
            document.getElementById("rr").textContent = "Loaded";
            document.getElementById("sbp").textContent = "Success!";
            document.getElementById("hr").textContent = "🎉";
            document.getElementById("alertTime").textContent = new Date().toLocaleTimeString();

            // Fetch real observations (vitals/labs)
            client.request("Observation?category=vital-signs,laboratory&_count=100").then(obsData => {
              const entries = obsData.entry || [];
              const findings = [];
              const sbp = entries.find(e => e.resource.code?.coding?.[0]?.code === "8480-6")?.resource.valueQuantity?.value;
              const hgb = entries.find(e => e.resource.code?.coding?.[0]?.code === "718-7")?.resource.valueQuantity?.value;

              if (sbp && sbp < 90) findings.push({ dx: "Hypotension (shock risk)", evidence: `SBP ${sbp} mmHg` });
              if (hgb && hgb < 8) findings.push({ dx: "Severe anemia", evidence: `Hgb ${hgb} g/dL` });

              const list = document.getElementById("diagnosisList");
              list.innerHTML = "";
              if (findings.length === 0) {
                list.innerHTML = "<p class='text-center py-10 text-2xl text-gray-600'>No high-impact gaps detected in this test patient.</p>";
              } else {
                findings.forEach(f => {
                  const card = document.createElement("div");
                  card.className = "glass rounded-3xl p-8 border border-green-200 shadow-lg";
                  card.innerHTML = `<h3 class="text-3xl font-black text-green-700">${f.dx}</h3><p class="mt-4 text-lg text-gray-700">Evidence: ${f.evidence}</p>`;
                  list.appendChild(card);
                });
              }
            });

            document.getElementById("listPage").classList.add("hidden");
            document.getElementById("detailPage").classList.remove("hidden");
          });
        })
        .catch(err => {
          console.error(err);
          alert("Real Epic data load failed — showing simulated demo. Error: " + err.message);
          showPatient(1005);
        });
    };
  </script>
</body>
</html>
